<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whot</title>
<meta name="theme-color" content="#0d0d0d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{--nf:"Playfair Display",Georgia,serif;--ink:#1b1b1b;--gold:#e2a920;--bg:#0d0d0d;--tx:#f0e6cc;--pn:#1c1c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--tx:#f0e6cc}}
:root[data-theme="dark"]{--bg:#0d0d0d;--tx:#f0e6cc}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Playfair Display',Georgia,serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#app{max-width:520px;margin:0 auto}
#hd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px}
#hd b{font-size:22px;font-weight:800;display:block}#hd small{font-size:12px;opacity:.7}
.btn.sm{padding:9px 14px;font-size:13px;margin:0}
#chips{display:flex;gap:8px;padding:6px 10px}
.chip{flex:1;min-width:0;background:var(--pn);border:2px solid transparent;border-radius:18px;padding:8px 4px;text-align:center;font-size:12px}
.chip b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;font-size:13px}
.chip span{font-size:11px;opacity:.85}.chip .tm{font-style:normal;color:var(--gold);font-weight:800}
.chip.on{border-color:var(--gold)}.chip.on .av{box-shadow:0 0 0 3px var(--gold)}
.av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--gold);border:2px solid var(--gold);margin:0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
#msg{margin:6px 10px;padding:9px 14px;border-radius:16px;background:var(--pn);font-size:14px;line-height:1.3;min-height:1.3em}
#table{flex:1;min-height:0;margin:2px 10px 0;border-radius:34px;border:3px solid var(--gold);background:radial-gradient(circle at 50% 45%,#2a2a2a,#111 75%);color:#f0e6cc;display:flex;flex-direction:column}
#opps{display:flex;justify-content:space-around;padding:12px 6px 0}
.opp{text-align:center}.fan{position:relative;width:calc(var(--fw)*1.5);height:calc(var(--fw)*1.5);margin:0 auto}
.fan .card{position:absolute;left:50%;top:0;margin-left:calc(var(--fw)*-.5);--w:var(--fw);transform-origin:50% 130%;transform:rotate(var(--r))}
.pill{display:inline-block;margin-top:2px;background:#000;border-radius:14px;padding:5px 10px;font-size:12px;font-weight:700;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:2px solid transparent}
.pill em{font-style:normal;background:#333;border-radius:10px;padding:1px 7px;margin-left:4px}
.opp.on .pill{border-color:var(--gold)}
#piles{flex:1;display:flex;gap:30px;align-items:center;justify-content:center}
.pile{text-align:center}.pile small{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;padding:2px 10px;border-radius:12px}
.pile small.red{background:#c8243a;color:#fff}
.pile small img{width:1.2em;height:1.2em;vertical-align:-.25em;background:var(--ink);border-radius:4px;padding:2px}
.stk,.dsc{position:relative;width:var(--bw);height:calc(var(--bw)*1.3926)}
.stk .card,.dsc .card{position:absolute;left:0;top:0}
.stk .card:nth-child(1){transform:translate(-4px,4px)}.stk .card:nth-child(2){transform:translate(-2px,2px)}
.dsc .card{transform:rotate(var(--r))}
#dk{cursor:pointer}
#bar{display:flex;justify-content:space-between;align-items:center;padding:8px 18px;font-size:14px;min-height:34px}
#hand{display:flex;overflow-x:auto;padding:16px 14px;justify-content:safe center}
#hand .card+.card{margin-left:calc(var(--w)*-.4)}
.card.hc{--w:var(--hw)}
.rr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;text-align:left;font-size:14px}
.seg{background:#2b2b2b;color:#f0e6cc;border:2px solid #444;border-radius:12px;padding:6px 10px;margin-left:4px;font:700 13px 'Playfair Display',Georgia,serif;cursor:pointer}
.seg.on{background:var(--gold);color:#1b1b1b;border-color:var(--gold)}
.rr2{display:flex;gap:10px;text-align:left;padding:6px 0;font-size:14px;line-height:1.35}
.rr2 b{flex:none;min-width:48px;background:#2b2b2b;color:var(--gold);border-radius:12px;text-align:center;padding:2px 6px;align-self:flex-start}
.box h2{color:var(--gold);margin:0 0 10px}
.ov.sheet{align-items:flex-end;padding:0;background:rgba(0,0,0,.6)}
.sh{width:100%;max-width:520px;background:#151515;border-radius:26px 26px 0 0;padding:18px 12px calc(18px + env(safe-area-inset-bottom,0px))}
.sh p{font-weight:800;font-size:17px;margin:0 0 12px}

.card.back{background-image:var(--bk)}
.card.big{--w:var(--bw)}.card.sm{--w:34px}
.card.ok{transform:translateY(-12px);box-shadow:0 0 0 2px var(--gold)}
.card.dim{filter:brightness(.4)}
.cn{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1;font:900 .155em/1 var(--nf);font-variant-numeric:lining-nums;width:14%}
.cn img{width:.85em;margin-top:.16em}
.tl{left:7.5%;top:4.2%}.br{right:7.5%;bottom:3%;transform:rotate(180deg)}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mid img{display:block}.mid .circle{width:56%}.mid .triangle{width:66%}.mid .cross{width:67%}.mid .square{width:56%}.mid .star{width:58%}
.w20{font:900 .36em/1 var(--nf);margin-bottom:.03em}.wl{width:62%}
.ov.intro{padding:0}
.box.intro{perspective:1200px;max-width:none;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.logo{width:230px;max-width:80%;margin-bottom:12px}
.flip{--cw:min(82vw,56vh);width:var(--cw);height:calc(var(--cw)*1.3926);position:relative;transform-style:preserve-3d;animation:fl 5s ease-in-out infinite;filter:drop-shadow(0 14px 30px rgba(0,0,0,.7))}
.fc{position:absolute;inset:0;backface-visibility:hidden;background:#000 center/100% 100% no-repeat;border-radius:12px}
.f1{background-image:var(--bk)}.f2{background-image:var(--pb);transform:rotateY(180deg)}
@keyframes fl{0%,35%{transform:rotateY(0)}50%,85%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.tap{margin-top:26px;letter-spacing:.25em;font-size:14px;color:var(--gold);font-weight:800;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.3}}
.stage{--cw:min(40vw,27vh);position:relative;width:100%;height:100%;perspective:1200px;overflow:hidden}

.stage.go .pc{transform:rotate(calc(var(--k)*11deg)) rotateY(180deg)}

.pc>*:nth-child(2){transform:rotateY(180deg)}

.box{max-width:380px}
.box h1{font-size:64px;letter-spacing:.06em;margin:0 0 8px;color:var(--gold);font-weight:800}
.box p{line-height:1.5;font-size:15px;margin:0 0 18px}
.btn{background:var(--gold);color:#1b1b1b;border:0;border-radius:10px;padding:13px 18px;font:800 16px 'Playfair Display',Georgia,serif;margin:4px;cursor:pointer}

.sp img{width:34px;height:34px;object-fit:contain}
.in{font:600 16px 'Playfair Display',Georgia,serif;padding:11px;border-radius:10px;border:2px solid var(--gold);background:#1b1b1b;color:#f0e6cc;width:130px;text-align:center;margin:4px;box-sizing:border-box}

body{height:100%;height:100dvh;-webkit-text-size-adjust:100%}
.card.pbk{background-image:var(--pb)}
.fc,.pc>*{-webkit-backface-visibility:hidden}.flip,.pc{-webkit-transform-style:preserve-3d}
@media (max-height:640px){#chips{padding:2px 10px}.av{width:28px;height:28px;font-size:13px}.chip{padding:4px}.chip b{margin-top:2px}#hd small{display:none}#hd{padding:6px 14px 0}#msg{margin:3px 10px;padding:5px 12px}#hand{padding:10px 14px}#bar{padding:4px 18px;min-height:28px}}
#table.green{background:radial-gradient(circle at 50% 45%,#2f7d4f,#1d5a37 55%,#143f26);border:6px solid #6b4220}
#table.green .stk .card,#table.green .dsc .card,#table.green .fan .card{box-shadow:0 3px 8px rgba(0,0,0,.5)}
#cb{position:relative}#cb i{position:absolute;top:-7px;right:-5px;background:#c8243a;color:#fff;border-radius:10px;font:700 11px sans-serif;padding:1px 6px;font-style:normal}
#rx{position:fixed;left:50%;top:24%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#f0e6cc;border:2px solid var(--gold);border-radius:18px;padding:10px 16px;font-weight:800;z-index:30;display:none;max-width:84vw;text-align:center}
#cl{max-height:32vh;overflow:auto;margin-bottom:10px}.cm{margin:6px 0;font-size:14px;text-align:left;line-height:1.3;color:#f0e6cc}.cm b{color:var(--gold)}.cm.me{text-align:right}
#cr{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
#vb.live{background:var(--gold);color:#1b1b1b}#vc p{font-weight:400;font-size:15px;line-height:1.4}#vo{display:none}
#hd>span{display:inline-flex;align-items:center;gap:6px}#sb{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px}#sb .si{height:23px;width:auto;display:block}
@supports (height:100dvh){:root{--bw:clamp(52px,min(11.5dvh,24vw),88px);--hw:clamp(50px,min(10dvh,19vw),78px)}}
html{overflow:hidden;overscroll-behavior:none}
#opps{--oc:1;--fw:min(calc(var(--bw)*.52),calc((100vw - 56px)/var(--oc)/1.9))}
.pill{max-width:calc((100vw - 56px)/var(--oc) - 6px);font-size:clamp(10px,3.2vw,12px);padding:5px 8px}
#bar{gap:6px;padding:6px 12px}#bar>span{display:inline-flex;gap:6px}.btn.sm{padding:8px 11px}

let AC=null,SND=1,pv=null;try{SND=localStorage.getItem('whotSnd')==='0'?0:1}catch(e){}
const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC};
document.addEventListener('pointerdown',()=>{ac()},{passive:true});
function tone(f,t0,d,ty,v,f2){const a=AC,t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
function noise(t0,d,v,fr){const a=AC,n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=fr;const g=a.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+t0)}
const SFX={play:()=>{noise(0,.07,.5,2200);tone(180,0,.07,'triangle',.18,90)},
draw:()=>{noise(0,.09,.3,1200);noise(.1,.09,.25,1000);tone(330,.02,.08,'sine',.08,260)},
pen:()=>{tone(300,0,.14,'triangle',.2,200);tone(220,.15,.2,'triangle',.2,140)},
turn:()=>{tone(660,0,.14,'sine',.16);tone(880,.12,.22,'sine',.16)},
nomove:()=>{tone(392,0,.12,'sine',.16);tone(311,.13,.2,'sine',.16)},
whot:()=>{[784,988,1175,1568].forEach((f,i)=>tone(f,i*.07,.2,'sine',.12))},
win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3,'sine',.18))},
lose:()=>{tone(330,0,.25,'triangle',.15,220);tone(247,.25,.35,'triangle',.15,165)}};
function sfx(k,d){if(!SND)return;if(d){setTimeout(()=>sfx(k),d);return}if(!ac())return;try{SFX[k]()}catch(e){}}
function sounds(me,S,hand){const p=pv;pv=V;if(!p||V.n===p.n||p.win>=0||!p.P||p.P.length!==V.P.length)return;
if(V.win>=0){sfx(V.P[V.win].id===mePeer()?'win':'lose');return}
let dec=0,inc=0;V.P.forEach((x,i)=>{const dl=x.h.length-p.P[i].h.length;if(dl<0)dec=1;if(dl>inc)inc=dl});
if(dec){sfx(S.top.s==='whot'?'whot':'play');if(inc)sfx('draw',180)}
else if(inc)sfx(inc>=2?'pen':'draw');
if(me>=0&&V.t===me&&p.t!==V.t)sfx(hand.some(c=>ok(c,S,hand.length))?'turn':'nomove',dec||inc?450:0)}
const setH=(id,h)=>{const e=$(id);if(e._h!==h){e.innerHTML=h;e._h=h}};
function fit(){const r=document.documentElement.style,t=$('table');if(!t||!t.clientHeight)return;let b=Math.min(88,innerWidth*.24),g=0;r.setProperty('--bw',b+'px');while(t.scrollHeight>t.clientHeight+1&&b>44&&g++<14){b-=4;r.setProperty('--bw',b+'px')}}
addEventListener('resize',fit);
function leave(){clearTimeout(bt);if(room)room.leave();room=null;isHost=false;G=V=null;pv=null;hostPeer=null;mode='menu';$('rl').style.display=$('pk').style.display=$('ch').style.display=$('vs').style.display='none';CH.length=0;unread=0;if(vOn)vLeave();ui()}
function go(){const ps=room.peers().filter(p=>p.kind==='viewer').sort((a,b)=>(b.presence.host?1:0)-(a.presence.host?1:0));
if(ps.length+cpuN<2)return err('Add a CPU player or wait for a friend.');
begin(ps.map(p=>({id:p.peer,name:clean(p.presence.name)})),cpuN)}
$('ov').onclick=e=>{const b=e.target.closest('button');if(!b){if(mode==='intro'){mode='intro2';ui();setTimeout(()=>{const t=$('ov').querySelector('.stage');t&&t.classList.add('go')},80);setTimeout(()=>{if(mode==='intro2'){mode='menu';ui()}},3200)}return}
if(b.dataset.n){isHost=true;room=null;lastCpu=+b.dataset.n-1;begin([{id:'me',name:'You'}],lastCpu)}
else if(b.dataset.c){cpuN=Math.max(0,Math.min(3,cpuN+ +b.dataset.c));ui()}
else if(b.id==='rs')showRules(true);
else if(b.id==='mk'){nick=clean($('nick').value);openRoom(Math.random().toString(36).slice(2,6),true)}
else if(b.id==='jn'){nick=clean($('nick').value);const c=$('cd').value.trim().toLowerCase();if(!/^[a-z0-9]{4}$/.test(c))return err('Enter the 4-character code.');openRoom(c,false)}
else if(b.id==='go')go();
else if(b.id==='again'){if(room)go();else begin([{id:'me',name:'You'}],lastCpu)}
else if(b.id==='home')leave()};
$('rl').onclick=e=>{const g=e.target.closest('.seg');if(g){RULES[g.dataset.k]=+g.dataset.v;showRules(true);return}if(e.target.id==='rl'||e.target.id==='rlx')$('rl').style.display='none'};
$('hd').onclick=e=>{const sb=e.target.closest('#sb');if(sb){SND=SND?0:1;try{localStorage.setItem('whotSnd',SND)}catch(x){}sb.innerHTML=SI();if(SND)sfx('turn');return}const b=e.target.closest('#lv');if(!b)return;if(lt&&Date.now()-lt<2500){lt=0;leave()}else{lt=Date.now();b.textContent='Tap again';setTimeout(()=>{if(b.isConnected)b.textContent='Leave'},2500)}};
let TG=0;try{TG=+localStorage.getItem('whotTable')||0}catch(x){}

$('bar').onclick=e=>{if(e.target.closest('#rb'))showRules(false);else if(e.target.closest('#tb')){TG=TG?0:1;try{localStorage.setItem('whotTable',TG)}catch(x){}applyT()}};
$('hand').onclick=e=>{const el=e.target.closest('[data-c]');if(!el||!V)return;const me=V.P.findIndex(p=>p.id===mePeer());if(me<0||V.t!==me||V.win>=0)return;

setInterval(()=>{const e=document.querySelector('.tm');if(e&&V&&V.tm&&V.win<0)e.textContent=Math.max(0,Math.ceil(V.tm-(Date.now()-rx)/1000))+'s'},400);
setInterval(()=>{if(!isHost||!room||!G)return;let ch=0;const al=new Set(room.peers().map(p=>p.peer));
if(G.over<0&&al.size)G.P.forEach(p=>{if(p.cpu&&p.was&&al.has(p.id)){p.cpu=0;p.name=p.name.replace(' (CPU)','');ch=1}else if(!p.cpu&&!al.has(p.id)&&Date.now()>(G.grace||0)){p.cpu=1;p.was=1;p.name+=' (CPU)';ch=1}});
if(ch){sync();tick()}else resend()},2500);
